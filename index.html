<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>成都大学 · 漫游</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;
    background:radial-gradient(circle at 50% 40%,#5a3d22,#2b1d12 70%);
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#f6ead2;user-select:none}
  #cv{display:block;position:absolute;inset:0;cursor:default}
  #cv.edit{cursor:crosshair}
  .panel{position:absolute;border-radius:10px;
    background:linear-gradient(#c08a4e,#9a6536 55%,#84532b);
    border:3px solid #4a2e18;
    box-shadow:inset 0 0 0 2px #dcae74,inset 0 -6px 0 rgba(0,0,0,.18),0 10px 26px rgba(0,0,0,.45);
    text-shadow:0 1px 0 rgba(0,0,0,.35)}
  /* 左上 信息 */
  #hud{left:14px;top:14px;padding:10px 14px;font-size:13px;line-height:1.7;max-width:300px}
  #hud b{color:#fff3c4}
  #hud .k{display:inline-block;min-width:18px;padding:1px 6px;margin:0 2px;border-radius:4px;
    background:linear-gradient(#f4dfb2,#e2c184);border:1px solid #6b4520;font-size:12px;
    text-align:center;color:#4a2d12;text-shadow:none;font-weight:700}
  /* 右上 控制 */
  #ctrl{right:14px;top:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:212px}
  .row{display:flex;align-items:center;gap:8px;font-size:13px}
  .row label{color:#fff0d0;white-space:nowrap;font-weight:700}
  select,input[type=range]{width:100%}
  select{background:linear-gradient(#f4dfb2,#e2c184);color:#4a2d12;border:2px solid #6b4520;
    border-radius:6px;padding:4px 8px;font-size:13px;font-family:inherit;font-weight:700}
  input[type=range]{-webkit-appearance:none;height:6px;border-radius:3px;background:#5e3b1c;outline:none;
    border:1px solid #3a2312}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe9b8,#d8a763 70%);border:2px solid #4a2e18;cursor:pointer}
  button{font-family:inherit;font-size:13px;font-weight:700;color:#3f2711;
    background:linear-gradient(#f6e2b6,#dcb87c 60%,#cba469);
    border:2px solid #5e3b1c;border-radius:7px;padding:5px 10px;cursor:pointer;
    box-shadow:inset 0 0 0 1px #fff3d0,0 2px 0 #4a2e18;transition:.12s;text-shadow:0 1px 0 rgba(255,255,255,.45)}
  button:hover{filter:brightness(1.07)}
  button:active{transform:translateY(2px);box-shadow:inset 0 0 0 1px #fff3d0}
  button.on{background:linear-gradient(#ffe08a,#f0b93f);border-color:#8a5c12}
  button.danger{background:linear-gradient(#ffd9d0,#e79c8c);border-color:#7a3326}
  button.danger:hover{filter:brightness(1.05)}
  #speedVal{color:#fff3c4;min-width:34px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  /* 左侧 互动点列表 */
  #list{left:14px;bottom:74px;width:270px;max-height:calc(100% - 230px);overflow:auto;
    padding:10px;display:none;flex-direction:column;gap:6px}
  #list.show{display:flex}
  #list .hd{font-size:12px;color:#fff0d0;font-weight:700;display:flex;justify-content:space-between;align-items:center;
    padding:0 2px 4px}
  .item{display:flex;align-items:center;gap:6px;background:linear-gradient(#f7e7c4,#eed9ae);
    border:2px solid #6b4520;border-radius:6px;padding:4px 6px}
  .item .nm{flex:1;min-width:0;background:transparent;border:none;color:#3f2711;font-size:13px;
    font-weight:700;font-family:inherit;padding:2px 0;outline:none;text-shadow:none}
  .item .nm:focus{color:#000;border-bottom:2px solid #c8901f}
  .item.mini{font-size:12px;color:#6b4a2a}
  .item .btn{padding:2px 7px;font-size:11px;border-radius:5px}
  .empty{font-size:12px;color:#ffe7bd;line-height:1.7;padding:6px 2px}
  /* 底部 提示 */
  #hint{left:50%;transform:translateX(-50%);bottom:16px;padding:7px 18px;font-size:13px;font-weight:700;
    color:#3f2711;white-space:nowrap;display:none;text-shadow:none;
    background:linear-gradient(#f7e7c4,#e0c48d);border:3px solid #4a2e18;border-radius:8px;
    box-shadow:inset 0 0 0 2px #fff3d0,0 6px 16px rgba(0,0,0,.4)}
  #hint.show{display:block}
  /* 详情卡片 */
  #modal{position:fixed;inset:0;background:rgba(5,8,14,.82);display:none;
    align-items:center;justify-content:center;z-index:50;padding:26px}
  #modal.show{display:flex}
  #card{position:relative;max-width:min(1100px,94vw);max-height:92vh;display:flex;
    flex-direction:column;gap:10px;
    background:linear-gradient(#c08a4e,#9a6536 55%,#84532b);
    border:4px solid #4a2e18;border-radius:12px;padding:16px;
    box-shadow:inset 0 0 0 2px #dcae74,0 20px 60px rgba(0,0,0,.6)}
  #card img{max-width:86vw;max-height:76vh;object-fit:contain;border-radius:6px;display:block;
    border:3px solid #4a2e18}
  #card .ttl{font-size:17px;font-weight:700;color:#fff8e8;padding:0 34px 0 4px;
    text-shadow:0 2px 0 rgba(0,0,0,.35)}
  #card .ph{width:min(760px,84vw);height:min(420px,52vh);border-radius:8px;display:flex;
    align-items:center;justify-content:center;flex-direction:column;gap:10px;
    background:repeating-linear-gradient(45deg,#f3e3c0,#f3e3c0 12px,#e9d5ac 12px,#e9d5ac 24px);
    border:3px dashed #8a5c2a;color:#6b4a2a;font-size:14px;text-align:center;line-height:1.9;
    text-shadow:none}
  #card .ph .big{font-size:26px;color:#4a2d12;font-weight:700}
  #close{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;
    padding:0;font-size:17px;line-height:1}
  /* 提示条 */
  #toast{position:fixed;left:50%;top:22px;transform:translateX(-50%) translateY(-14px);
    background:linear-gradient(#f7e7c4,#e0c48d);border:3px solid #4a2e18;border-radius:8px;
    padding:8px 18px;font-size:13px;font-weight:700;color:#3f2711;opacity:0;transition:.28s;
    pointer-events:none;z-index:99;box-shadow:inset 0 0 0 2px #fff3d0,0 6px 16px rgba(0,0,0,.4);
    text-shadow:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 触屏 */
  body.touch .kb{display:none}
  body:not(.touch) .tp{display:none}
  #stick{position:fixed;left:20px;bottom:20px;width:132px;height:132px;border-radius:50%;
    background:rgba(74,46,24,.34);border:3px solid #4a2e18;display:none;
    box-shadow:inset 0 0 0 2px rgba(220,174,116,.7);touch-action:none;z-index:60}
  #stick.on{display:block}
  #knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;
    border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9b8,#c08a4e 75%);
    border:3px solid #4a2e18;
    box-shadow:0 4px 14px rgba(0,0,0,.45);will-change:transform}
  #rot{position:fixed;inset:0;background:#0d1117;display:none;align-items:center;
    justify-content:center;flex-direction:column;gap:14px;z-index:200;color:#cfe8ff;
    font-size:16px;text-align:center;padding:24px}
  #rot.on{display:flex}
  #rot .icon{font-size:46px;transform:rotate(90deg)}
  /* 手机右侧功能键 */
  #acts{position:fixed;right:16px;bottom:20px;display:none;flex-direction:column;gap:12px;z-index:30;align-items:flex-end}
  body.touch #acts{display:flex}
  .actbtn{width:74px;height:74px;border-radius:50%;border:3px solid #4a2e18;
    background:radial-gradient(circle at 35% 30%,#f7e7c4,#d8a866 70%,#b0783c);
    color:#3f2711;font-size:15px;font-weight:800;
    box-shadow:inset 0 0 0 2px #fff3d0,0 6px 18px rgba(0,0,0,.4);touch-action:none;cursor:pointer;
    text-shadow:0 1px 0 rgba(255,255,255,.5)}
  .actbtn:active{filter:brightness(.92);transform:scale(.96)}
  .actbtn.sec{width:58px;height:58px;font-size:13px}
  .actbtn.on{background:radial-gradient(circle at 35% 30%,#fff6c4,#ffcf4a 70%,#e0a51f);
    border-color:#8a5c12;color:#3a2405}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="panel">
  <div><b>成都大学 · 漫游</b></div>
  <div class="kb"><span class="k">W</span><span class="k">A</span><span class="k">S</span><span class="k">D</span> 或方向键 走动</div>
  <div class="kb"><span class="k">Shift</span> 加速　<span class="k">F</span> 查看　<span class="k">E</span> 编辑</div>
  <div class="kb"><span class="k">+</span><span class="k">-</span> 缩放　滚轮 也可　<span class="k">R</span> 回中心</div>
  <div class="tp">左下摇杆走动 · 推到底加速<br>点圆点查看 · 右上「编辑」布置互动点</div>
</div>

<div id="ctrl" class="panel">
  <div class="row"><label>地图</label><select id="mapSel"></select></div>
  <div class="row"><label>速度</label><input id="speed" type="range" min="40" max="150" step="5"><span id="speedVal"></span></div>
  <div class="row">
    <button id="editBtn" style="flex:1">编辑模式 (E)</button>
  </div>
  <div class="row">
    <button id="zout">－</button><button id="zin">＋</button><button id="fsBtn" style="display:none">全屏</button>
  </div>
  <div class="row">
    <button id="expBtn" style="flex:1">导出</button>
    <button id="impBtn" style="flex:1">导入</button>
  </div>
  <input id="impFile" type="file" accept=".json,application/json" hidden>
</div>

<div id="list" class="panel">
  <div class="hd"><span>互动点</span><span id="cnt"></span></div>
  <div id="listBody"></div>
  <div class="item mini" id="addTip" style="display:none">编辑模式下点击地图空白处 = 新增互动点</div>
  <button id="clearBtn" class="danger" style="display:none">清空本图互动点</button>
</div>

<div id="hint" class="panel"></div>

<div id="modal">
  <div id="card">
    <button id="close">✕</button>
    <div class="ttl" id="mtitle"></div>
    <div id="mbody"></div>
  </div>
</div>

<div id="toast"></div>
<div id="stick"><div id="knob"></div></div>
<div id="acts">
  <button id="actF" class="actbtn">查看</button>
  <button id="actE" class="actbtn sec">编辑</button>
</div>
<div id="rot">
  <div class="icon">📱</div>
  <div>请把手机横过来玩</div>
  <div style="font-size:13px;opacity:.7">横屏后左下角会出现摇杆</div>
</div>

function walkable(wx, wy){
  if(!WALK || curId() !== 'hand') return true;
  const cx = Math.floor(wx/CELL), cy = Math.floor(wy/CELL);
  if(cx<0 || cy<0 || cx>=GW || cy>=GH) return false;
  const i = cy*GW + cx;
  return ((WALK[i>>3] >> (i&7)) & 1) === 1;
}
function canStand(x, y){
  const r = 3;
  return walkable(x,y) && walkable(x-r,y) && walkable(x+r,y) && walkable(x,y-r) && walkable(x,y+r);
}
function nearestWalkable(x, y){
  if(canStand(x,y)) return [x,y];
  for(let r=4; r<=90; r+=4)
    for(let a=0; a<6.2832; a+=Math.PI/10){
      const nx = x+Math.cos(a)*r, ny = y+Math.sin(a)*r;
      if(canStand(nx,ny)) return [nx,ny];
    }
  return [x,y];
}

function findOpenSpot(cx, cy){
  // 在地图中间附近找一块最开阔的可走地（四周 5 格都通），当出生点
  let best = null, bs = -1e9;
  for(let gy=6; gy<GH-6; gy+=2)
    for(let gx=6; gx<GW-6; gx+=2){
      const wx = gx*CELL+2, wy = gy*CELL+2;
      if(!walkable(wx,wy)) continue;
      let free = 0;
      for(let dy=-5; dy<=5; dy++)
        for(let dx=-5; dx<=5; dx++)
          if(walkable(wx+dx*CELL, wy+dy*CELL)) free++;
      const s = free - Math.hypot(wx-cx, wy-cy)*0.08;
      if(s > bs){ bs = s; best = [wx,wy]; }
    }
  return best || nearestWalkable(cx, cy);
}

function curImg(){ return imgs[curId()]; }
function onMapReady(){
  const im = curImg();
  if(!im) return;
  // 逻辑尺寸用 MAPS 里声明的（图片可能是 2 倍清晰版，坐标仍按 1080x552 算）
  const m = MAPS[mapIdx];

  const [sx, sy] = findOpenSpot(MW*0.5, MH*0.5);
  player.x = sx; player.y = sy;
  zoom = defaultZoom();
  cam.x = player.x; cam.y = player.y;
  clampCam();

function defaultZoom(){ return Math.max(cw/MW, ch/MH) * 2.0; }
function clampCam(){
  const hw = cw/2/zoom, hh = ch/2/zoom;
  cam.x = (MW <= hw*2) ? MW/2 : Math.min(Math.max(cam.x, hw), MW-hw);
  cam.y = (MH <= hh*2) ? MH/2 : Math.min(Math.max(cam.y, hh), MH-hh);
}
function w2s(wx, wy){ return [ (wx-cam.x)*zoom + cw/2, (wy-cam.y)*zoom + ch/2 ]; }
function s2w(sx, sy){ return [ (sx-cw/2)/zoom + cam.x, (sy-ch/2)/zoom + cam.y ]; }

/* ============ 输入 ============ */
const keys = {};
const MOVE_CODES = ['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
function isTyping(){
  const a = document.activeElement;
  if(!a) return false;
  if(a.tagName==='TEXTAREA' || a.tagName==='SELECT') return true;
  if(a.tagName==='INPUT') return (a.type!=='range' && a.type!=='file' && a.type!=='button');
  return !!a.isContentEditable;
}
addEventListener('keydown', e=>{
  const code = e.code || '';
  if(MOVE_CODES.includes(code) || code==='Space') e.preventDefault();
  if(e.isComposing || isTyping()){
    if(code==='Escape'){ closeModal(); if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
    return;
  }
  if(keys[code]) return;
  keys[code] = true;
  if(code==='KeyE') toggleEdit();
  else if(code==='KeyF') tryInteract();
  else if(code==='Escape') closeModal();
  else if(code==='KeyR'){ player.x=MW/2; player.y=MH/2; cam.x=player.x; cam.y=player.y; clampCam(); }
  else if(code==='Equal'||code==='NumpadAdd') setZoom(zoom*1.18);
  else if(code==='Minus'||code==='NumpadSubtract') setZoom(zoom/1.18);
});
addEventListener('keyup', e=>{ keys[e.code||''] = false; });
addEventListener('blur', ()=>{ for(const k in keys) keys[k] = false; });
addEventListener('wheel', e=>{ e.preventDefault(); setZoom(zoom * (e.deltaY<0?1.12:1/1.12)); }, {passive:false});
function setZoom(z){
  const [wx,wy] = s2w(cw/2, ch/2);
  const minZ = Math.max(cw/MW, ch/MH)*0.9;
  zoom = Math.min(Math.max(z, minZ), 6);
  const [nx,ny] = s2w(cw/2, ch/2);
  cam.x += wx-nx; cam.y += wy-ny; clampCam();
}

/* ============ 主循环 ============ */
let last = performance.now(), T = 0;
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now; T += dt;
  update(dt); draw();
  requestAnimationFrame(loop);
}

function update(dt){
  let ax=0, ay=0;
  if(keys['KeyW']||keys['ArrowUp']) ay--;
  if(keys['KeyS']||keys['ArrowDown']) ay++;
  if(keys['KeyA']||keys['ArrowLeft']) ax--;
  if(keys['KeyD']||keys['ArrowRight']) ax++;
  const kv = Math.hypot(ax,ay);
  if(kv > 0.1){ ax/=kv; ay/=kv; }
  else if(joy.active && Math.hypot(joy.x,joy.y) > 0.08){ ax = joy.x; ay = joy.y; }

  const mag = Math.hypot(ax,ay);
  player.moving = mag > 0.08;
  if(player.moving){
    const sprint = keys['ShiftLeft'] || keys['ShiftRight'] || (joy.active && mag > 0.92);
    const base = speed * (sprint?1.8:1) / zoom * 1.6;
    const sp = base * Math.min(1, mag);
    const dx = ax*sp*dt, dy = ay*sp*dt;
    // 分轴判定，撞墙时沿墙滑行（像走迷宫）
    if(canStand(player.x+dx, player.y)) player.x += dx;
    if(canStand(player.x, player.y+dy)) player.y += dy;
    player.x = Math.min(Math.max(player.x, 4), MW-4);
    player.y = Math.min(Math.max(player.y, 4), MH-4);
    // 8 方向朝向：把"屏幕上的移动方向"换算成烤图机位角
    // 机位 a=45*i 时，模型正面的屏幕朝向 = (-cos a, sin a)，故 i = atan2(dy, -dx)
    // 8 方向：右0 右下1 下2 左下3 左4 左上5 上6 右上7（与烤图机位一致）
    player.face = ((Math.round(Math.atan2(ay, ax) / (Math.PI/4)) % 8) + 8) % 8;
    player.walk += dt * (9 + Math.min(1,mag)*4);
  }
  cam.x += (player.x-cam.x) * Math.min(1, dt*8);
  cam.y += (player.y-cam.y) * Math.min(1, dt*8);
  clampCam();
  updateHint();
}

function nearSpot(){
  const [px,py] = w2s(player.x, player.y);
  let best=null, bd=1e9;
  for(const s of spots()){
    const [sx,sy] = w2s(s.x, s.y);
    const d = Math.hypot(sx-px, sy-py);
    if(d<110 && d<bd){ bd=d; best=s; }
  }
  return best;
}
function updateHint(){
  const el = document.getElementById('hint');
  const s = nearSpot();
  if(s && !editMode){ el.textContent = `按 F 查看：${s.name}`; el.classList.add('show'); }
  else el.classList.remove('show');
}

/* ============ 绘制 ============ */
/* 地面装饰层：只在可走区域撒草花石子，避免糊住建筑 */
const decorCache = {};
function decorLayer(id, w, h){
  if(decorCache[id]) return decorCache[id];
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  let seed = 20261125;
  const rnd = () => (seed = (seed*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const N = Math.round(w*h/700);
  for(let i=0;i<N;i++){
    const x = rnd()*w, y = rnd()*h;
    if(!walkable(x,y)) continue;
    const t = rnd();
    if(t < 0.56){                     // 草丛
      g.globalAlpha = 0.5; g.strokeStyle = '#3f7a32'; g.lineWidth = 1.5;
      g.beginPath();
      g.moveTo(x,y); g.lineTo(x-2.4,y-4);
      g.moveTo(x,y); g.lineTo(x+2.4,y-4.2);
      g.moveTo(x,y); g.lineTo(x+0.3,y-5.4);
      g.stroke();
    } else if(t < 0.82){              // 小花
      g.globalAlpha = 0.6;
      g.fillStyle = rnd()<0.5? '#f4dc72' : '#f7f7f2';
      g.beginPath(); g.arc(x,y,1.6,0,7); g.fill();
    } else {                          // 石子
      g.globalAlpha = 0.5; g.fillStyle = '#8d8577';
      g.beginPath(); g.ellipse(x,y,2.3,1.6,rnd()*3,0,7); g.fill();
    }
  }
  g.globalAlpha = 1;
  decorCache[id] = c;
  return c;
}

function draw(){
  ctx.clearRect(0,0,cw,ch);
  ctx.fillStyle = '#3a2615'; ctx.fillRect(0,0,cw,ch);
  const im = curImg();
  if(!im) return;

  // 地图
  const [ox,oy] = w2s(0,0);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(im, ox, oy, MW*zoom, MH*zoom);
  // 地面装饰（草花石子）
  if(im.complete && im.naturalWidth){
    const dl = decorLayer(curId(), MW, MH);
    ctx.drawImage(dl, ox, oy, MW*zoom, MH*zoom);
  }
  // 地图边框（木框）
  ctx.strokeStyle = '#4a2e18'; ctx.lineWidth = 6;
  ctx.strokeRect(ox, oy, MW*zoom, MH*zoom);
  ctx.strokeStyle = 'rgba(220,174,116,.55)'; ctx.lineWidth = 2;
  ctx.strokeRect(ox+3, oy+3, MW*zoom-6, MH*zoom-6);

  // 互动点
  for(const s of spots()){
    const [sx,sy] = w2s(s.x, s.y);
    if(sx<-80||sy<-80||sx>cw+80||sy>ch+80) continue;
    const near = Math.hypot(sx-w2s(player.x,player.y)[0], sy-w2s(player.x,player.y)[1]) < 110;
    const pulse = 1 + 0.18*Math.sin(T*3 + s.x);
    const r = 18 * pulse;

    ctx.beginPath(); ctx.arc(sx,sy,r+11,0,7); ctx.fillStyle = near? 'rgba(255,214,102,.45)':'rgba(120,90,50,.28)'; ctx.fill();
    ctx.beginPath(); ctx.arc(sx,sy,r,0,7);
    ctx.fillStyle = s.img ? (near?'#ffd25a':'#f0c060') : (near?'#e8d9b8':'#cdbfa2');
    ctx.fill();
    ctx.lineWidth = 3.5; ctx.strokeStyle = '#4a2e18'; ctx.stroke();
    ctx.lineWidth = 1.8; ctx.strokeStyle = 'rgba(255,247,220,.85)'; ctx.stroke();
    // 中心
    ctx.beginPath(); ctx.arc(sx,sy,5.5,0,7); ctx.fillStyle = 'rgba(74,46,24,.85)'; ctx.fill();

    // 名字（羊皮纸牌）
    ctx.font = 'bold 16px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    const tw = ctx.measureText(s.name).width;
    const ty = sy - r - 8;
    ctx.fillStyle = '#4a2e18';
    roundRect(sx-tw/2-10, ty-25, tw+20, 27, 6); ctx.fill();
    ctx.fillStyle = '#f7e7c4';
    roundRect(sx-tw/2-7, ty-22, tw+14, 21, 5); ctx.fill();
    ctx.fillStyle = '#3f2711';
    ctx.fillText(s.name, sx, ty-5);

    if(editMode && s===dragSpot){
      ctx.beginPath(); ctx.arc(sx,sy,r+13,0,7);
      ctx.setLineDash([5,4]); ctx.strokeStyle='#ffd25a'; ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]);
    }
  }

  // 角色
  drawPlayer();
}

function drawPlayer(){
  const [sx,sy] = w2s(player.x, player.y);
  const k = Math.min(2.1, Math.max(0.85, zoom*0.55));
  const H = Math.min(200, Math.max(64, 46*zoom));   // 屏幕身高（随缩放变大）
  const W = H * (SPR_W/SPR_H);            // 按贴图比例
  const hop = player.moving ? Math.abs(Math.sin(player.walk)) * 3.4 * k : 0;
  const f = ((player.face % 8) + 8) % 8;
  ctx.save();
  // 影子（贴地的椭圆，跳起来时变小变淡）
  const lift = hop / Math.max(1, H);
  ctx.globalAlpha = 0.30 - lift * 0.12;
  ctx.fillStyle = '#1b2b14';
  ctx.beginPath();
  ctx.ellipse(sx, sy - 2, W*0.34*(1-lift*0.3), W*0.13*(1-lift*0.3), 0, 0, 7);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.imageSmoothingQuality = 'high';
  if(spriteImg && spriteImg.complete && spriteImg.naturalWidth){
    ctx.drawImage(spriteImg, f*SPR_W, 0, SPR_W, SPR_H, sx - W/2, sy - H - hop, W, H);
  }else{
    ctx.beginPath(); ctx.arc(sx, sy-16*k, 9*k, 0, 7);
    ctx.fillStyle = '#2b3a52'; ctx.fill();
  }
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ============ 交互 ============ */
let editMode = false, dragSpot = null, dragging = false, downPt = null, movedPx = 0;

function toggleEdit(){
  editMode = !editMode;
  document.getElementById('editBtn').classList.toggle('on', editMode);
  document.getElementById('editBtn').textContent = editMode? '编辑中 (E 退出)' : '编辑模式 (E)';
  document.getElementById('list').classList.toggle('show', editMode);
  document.getElementById('addTip').style.display = editMode? 'flex':'none';
  document.getElementById('clearBtn').style.display = editMode? 'block':'none';
  cv.classList.toggle('edit', editMode);
  if(isTouch) stick.classList.toggle('on', !editMode);
  renderList();
  toast(editMode? '编辑模式：点空白处新增，拖动圆点可移动' : '已退出编辑模式');
}

cv.addEventListener('pointerdown', e=>{
  movedPx = 0; downPt = {x:e.clientX, y:e.clientY};
  const hit = hitTest(e.clientX, e.clientY);
  if(editMode){
    if(hit){ dragSpot = hit; dragging = true; cv.setPointerCapture(e.pointerId); renderList(); }
  }
});
cv.addEventListener('pointermove', e=>{
  if(downPt) movedPx = Math.max(movedPx, Math.hypot(e.clientX-downPt.x, e.clientY-downPt.y));
  if(dragging && dragSpot){
    const [wx,wy] = s2w(e.clientX, e.clientY);
    dragSpot.x = Math.min(Math.max(wx,0), MW); dragSpot.y = Math.min(Math.max(wy,0), MH);
  }
});
cv.addEventListener('pointerup', e=>{
  if(dragging){
    const wasDrag = movedPx >= 6;
    const s = dragSpot;
    dragging = false; dragSpot = null; saveStore(); renderList();
    if(!wasDrag && s) openSpot(s);
  }
  else if(movedPx < 6){
    const hit = hitTest(e.clientX, e.clientY);
    if(hit) openSpot(hit);
    else if(editMode) addSpotAt(e.clientX, e.clientY);
  }
  downPt = null;
});

function hitTest(sx, sy){
  let best=null, bd = isTouch? 62 : 46;
  for(const s of spots()){
    const [hx,hy] = w2s(s.x,s.y);
    const d = Math.hypot(hx-sx, hy-sy);
    if(d<bd){ bd=d; best=s; }
  }
  return best;
}

function addSpotAt(sx, sy){
  const [wx,wy] = s2w(sx,sy);
  const n = spots().length+1;
  const s = { id:'h'+Date.now().toString(36), name:'新地点'+n, x:wx, y:wy, img:null };
  spots().push(s); saveStore(); renderList();
  toast('已新增「'+s.name+'」，在左侧列表可改名/上传图片');
}

function tryInteract(){
  if(editMode) return;
  const s = nearSpot();
  if(s) openSpot(s); else toast('附近没有互动点，走近一点再按 F');
}

/* 详情卡片 */
function openSpot(s){
  document.getElementById('mtitle').textContent = s.name;
  const body = document.getElementById('mbody');
  body.innerHTML = '';
  if(s.img){
    const im = new Image(); im.src = s.img;
    im.style.maxWidth='86vw'; im.style.maxHeight='76vh'; im.style.objectFit='contain';
    im.style.borderRadius='10px'; im.style.display='block';
    body.appendChild(im);
  }else{
    const d = document.createElement('div'); d.className='ph';
    d.innerHTML = '<div class="big">'+escapeHtml(s.name)+'</div>'+
      '<div>这个互动点的照片还没添加</div>'+
      '<div style="font-size:12px;opacity:.75">编辑模式下在左侧列表点「上传图片」</div>';
    body.appendChild(d);
  }
  document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('close').onclick = closeModal;
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });

/* 列表 */
function renderList(){
  const body = document.getElementById('listBody');
  const arr = spots();
  document.getElementById('cnt').textContent = arr.length? arr.length+' 个' : '';
  body.innerHTML = '';
  if(!arr.length){
    const d = document.createElement('div'); d.className='empty';
    d.textContent = '还没有互动点。按 E 进入编辑模式，然后在地图上点一下就能添加。';
    body.appendChild(d); return;
  }
  arr.forEach((s,i)=>{
    const row = document.createElement('div'); row.className='item';

    const nm = document.createElement('input'); nm.className='nm'; nm.value = s.name;
    nm.oninput = ()=>{ s.name = nm.value || '未命名'; saveStore(); };
    nm.onblur = ()=> renderList();

    const up = document.createElement('button'); up.className='btn'; up.textContent = s.img?'换图':'上传图片';
    const f = document.createElement('input'); f.type='file'; f.accept='image/*'; f.hidden = true;
    up.onclick = ()=> f.click();
    f.onchange = ()=>{
      const file = f.files[0]; if(!file) return;
      downscale(file, url=>{
        if(!url){ toast('这张图片读不出来，换一张试试'); return; }
        s.img = url; saveStore(); renderList(); toast('「'+s.name+'」图片已设置');
      });
    };

    const del = document.createElement('button'); del.className='btn danger'; del.textContent='删';
    del.onclick = ()=>{ if(!confirm('删除互动点「'+s.name+'」？')) return;
      store[curId()] = spots().filter(x=>x!==s); saveStore(); renderList(); };

    row.append(nm, up, f, del);
    body.appendChild(row);
  });
}

function downscale(file, cb){
  const fr = new FileReader();
  fr.onload = ()=>{
    const im = new Image();
    im.onload = ()=>{
      const max = 1400;
      let w = im.width, h = im.height;
      const k = Math.min(1, max/Math.max(w,h));
      w = Math.max(1,Math.round(w*k)); h = Math.max(1,Math.round(h*k));
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(im,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.82));
    };
    im.onerror = ()=> cb(null);
    im.src = fr.result;
  };
  fr.onerror = ()=> cb(null);
  fr.readAsDataURL(file);
}

/* 顶栏 */
const mapSel = document.getElementById('mapSel');
MAPS.forEach((m,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=m.name; mapSel.appendChild(o); });
mapSel.value = mapIdx;
mapSel.onchange = ()=>{
  mapIdx = +mapSel.value; saveAll();
  onMapReady();
  renderList(); toast('已切换到「'+MAPS[mapIdx].name+'」（互动点按地图分开保存）');
};

const sp = document.getElementById('speed');
const spv = document.getElementById('speedVal');
sp.min = 40; sp.max = 150; sp.step = 5; sp.value = speed; spv.textContent = speed;
sp.oninput = ()=>{ speed = +sp.value; spv.textContent = speed; saveAll(); };

document.getElementById('editBtn').onclick = toggleEdit;
document.getElementById('clearBtn').onclick = ()=>{
  if(!confirm('清空「'+MAPS[mapIdx].name+'」上的全部互动点？此操作不可撤销。')) return;
  store[curId()] = []; saveStore(); renderList();
};

document.getElementById('expBtn').onclick = ()=>{
  const data = { version:3, savedAt:new Date().toISOString(), maps:store };
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '成都大学漫游-互动点.json';
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
  toast('已导出 JSON（含图片），换电脑用「导入」恢复');
};
document.getElementById('impBtn').onclick = ()=> document.getElementById('impFile').click();
document.getElementById('impFile').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const o = JSON.parse(fr.result);
      const m = o.maps || o;
      if(!m || typeof m!=='object') throw new Error('bad');
      if(!confirm('导入会覆盖当前所有互动点，继续？')) return;
      store = m; saveStore(); renderList(); toast('导入成功');
    }catch(err){ alert('这个文件不是有效的互动点备份。'); }
  };
  fr.readAsText(f);
  e.target.value = '';
};

/* 缩放 / 全屏按钮 */
document.getElementById('zin').onclick  = ()=> setZoom(zoom*1.25);
document.getElementById('zout').onclick = ()=> setZoom(zoom/1.25);
const fsBtn = document.getElementById('fsBtn');
if(isTouch) fsBtn.style.display = 'block';
fsBtn.onclick = async ()=>{
  try{
    if(!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){}
  try{ if(screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(e){}
  setTimeout(checkOrientation, 400);
};

/* 虚拟摇杆 */
const stick = document.getElementById('stick');
const knob  = document.getElementById('knob');
let stickId = null, sRect = null;
if(isTouch) stick.classList.add('on');
function stickStart(e){
  stickId = e.pointerId; sRect = stick.getBoundingClientRect();
  joy.active = true;
  try{ stick.setPointerCapture(e.pointerId); }catch(err){}
  stickMove(e); e.preventDefault();
}
function stickMove(e){
  if(stickId !== e.pointerId || !sRect) return;
  const cx = sRect.left + sRect.width/2, cy = sRect.top + sRect.height/2;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const max = sRect.width/2 - 20;
  const d = Math.hypot(dx,dy);
  if(d > max){ dx = dx/d*max; dy = dy/d*max; }
  joy.x = max? dx/max : 0; joy.y = max? dy/max : 0;
  knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  e.preventDefault();
}
function stickEnd(e){
  if(stickId !== e.pointerId) return;
  stickId = null; sRect = null; joy.active = false; joy.x = 0; joy.y = 0;
  knob.style.transform = 'translate(0,0)';
}
stick.addEventListener('pointerdown', stickStart);
stick.addEventListener('pointermove', stickMove);
stick.addEventListener('pointerup', stickEnd);
stick.addEventListener('pointercancel', stickEnd);

/* 横屏提示 */
/* 手机右侧功能键 */
(function(){
  const bF = document.getElementById('actF'), bE = document.getElementById('actE');
  if(bF) bF.addEventListener('click', e=>{ e.preventDefault(); tryInteract(); });
  if(bE) bE.addEventListener('click', e=>{ e.preventDefault(); toggleEdit();
    bE.classList.toggle('on', editMode); bE.textContent = editMode ? '退出' : '编辑'; });
})();

function checkOrientation(){  const portrait = innerHeight > innerWidth;
  document.getElementById('rot').classList.toggle('on', isTouch && portrait);
}
addEventListener('resize', checkOrientation);
setTimeout(checkOrientation, 100);

/* 小工具 */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* 启动 */
renderList();
requestAnimationFrame(loop);
setTimeout(()=>{ if(!spots().length) toast('提示：按 E 进入编辑模式，点地图即可添加互动点'); }, 900);
</script>
</body>
